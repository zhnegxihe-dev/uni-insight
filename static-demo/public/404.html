<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>跳转中… · UniInsight</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .box { text-align: center; color: #52525b; padding: 24px; }
    .box h1 { font-size: 18px; color: #18181b; margin: 0 0 8px; }
    .box p { font-size: 13px; margin: 4px 0; }
    .spinner { width: 28px; height: 28px; margin: 0 auto 12px; border: 3px solid #e4e4e7; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>正在进入 UniInsight…</h1>
    <p>你访问的地址在静态演示中没有对应文件，正在自动跳转到正确页面。</p>
    <p>若长时间无反应，请点击 <a id="go" href="/uni-insight/">这里回到首页</a></p>
  </div>
  <script>
    // GitHub Pages 无 SPA 回退：把无 hash 路径改写成 hash 路由，避免 "file not found"
    (function () {
      var base = "/uni-insight/";
      var path = location.pathname;
      if (path.indexOf("/uni-insight") === 0) {
        path = path.slice("/uni-insight".length);
      }
      path = path.replace(/^\/+|\/+$/g, "");
      var target = path
        ? base + "#/" + path + location.search + location.hash
        : base;
      var go = document.getElementById("go");
      if (go) go.href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
